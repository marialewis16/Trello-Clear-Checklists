<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Clear Checkmarks</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 12px;
            color: #172b4d;
        }

        p {
            margin-top: 0;
        }

        .board-info {
            font-size: 12px;
            color: #626f86;
            margin-bottom: 12px;
            overflow-wrap: anywhere;
        }

        .checklist-option {
            margin-bottom: 14px;
        }

        button {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            background: #0c66e4;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0055cc;
        }

        button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        .card-source {
            margin: 4px 2px 0;
            padding: 0 4px;
            color: #626f86;
            font-size: 12px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .card-source strong {
            color: #172b4d;
        }
    </style>
</head>
<body>
    <div id="content">Loading...</div>

    <script src="https://p.trellocdn.com/power-up.min.js"></script>

    <script>
        var t = window.TrelloPowerUp.iframe({
            appKey: '2ae1eadafa40bdc591b8e0ecbc9e5e6f',
            appName: 'Clear Checkmarks'
        });

        var content = document.getElementById('content');

        var API_KEY = '2ae1eadafa40bdc591b8e0ecbc9e5e6f';

        function showMessage(message) {
            content.textContent = message;
        }

        function getApi() {
            return Promise.resolve(t.getRestApi());
        }

        function apiUrl(path, token) {
            return 'https://api.trello.com/1' + path +
                (path.indexOf('?') === -1 ? '?' : '&') +
                'key=' + API_KEY +
                '&token=' + encodeURIComponent(token);
        }

        function getJson(url) {
            return fetch(url).then(function (response) {
                if (!response.ok) {
                    throw new Error(
                        'Trello request failed (' + response.status + ').'
                    );
                }

                return response.json();
            });
        }

        function loadChecklists() {
            showMessage('Finding checklists...');

            Promise.all([
                t.board('id'),
                getApi()
            ]).then(function (results) {

                var boardId = results[0].id;
                var api = results[1];

                return api.getToken().then(function (token) {

                    if (!token) {
                        throw new Error('Authorization is required.');
                    }

                    return Promise.all([
                        Promise.resolve(token),

                        getJson(
                            apiUrl(
                                '/boards/' + boardId + '?fields=id,name',
                                token
                            )
                        ),

                        getJson(
                            apiUrl(
                                '/boards/' + boardId +
                                '/cards?filter=open&checklists=all',
                                token
                            )
                        )
                    ]);
                });

            }).then(function (results) {

                var board = results[1];
                var cards = results[2];

                var entries = [];

                cards.forEach(function (card) {

                    if (!card.checklists) {
                        return;
                    }

                    card.checklists.forEach(function (checklist) {

                        entries.push({
                            checklist: checklist,
                            cardId: card.id,
                            cardName: card.name
                        });
                    });
                });

                if (entries.length === 0) {
                    content.innerHTML = '';

                    var emptyMessage = document.createElement('p');
                    emptyMessage.textContent =
                        'No checklists were found on active cards.';

                    content.appendChild(emptyMessage);

                    var emptyBoard = document.createElement('p');
                    emptyBoard.className = 'board-info';
                    emptyBoard.textContent =
                        'Board: ' + board.name + ' (' + board.id + ')';

                    content.appendChild(emptyBoard);
                    return;
                }

                content.innerHTML = '';

                var boardInfo = document.createElement('p');
                boardInfo.className = 'board-info';
                boardInfo.textContent =
                    'Reading active cards from board: ' +
                    board.name + ' (' + board.id + ')';

                content.appendChild(boardInfo);

                var heading = document.createElement('p');
                heading.textContent = 'Choose a checklist to clear:';
                content.appendChild(heading);

                var allButton = document.createElement('button');
                allButton.textContent = 'All Checklists';

                allButton.onclick = function () {
                    confirmClear(
                        'All Checklists',
                        entries.map(function (entry) {
                            return entry.checklist;
                        })
                    );
                };

                content.appendChild(allButton);

                var names = [];

                entries.forEach(function (entry) {
                    var name = entry.checklist.name;

                    if (names.indexOf(name) === -1) {
                        names.push(name);
                    }
                });

                names.sort(function (a, b) {
                    return a.localeCompare(b);
                });

                names.forEach(function (name) {

                    var matchingEntries = entries.filter(
                        function (entry) {
                            return entry.checklist.name === name;
                        }
                    );

                    var option = document.createElement('div');
                    option.className = 'checklist-option';

                    var button = document.createElement('button');
                    button.textContent = name;

                    button.onclick = function () {

                        var matchingChecklists = matchingEntries.map(
                            function (entry) {
                                return entry.checklist;
                            }
                        );

                        confirmClear(name, matchingChecklists);
                    };

                    option.appendChild(button);

                    var cardNames = [];

                    matchingEntries.forEach(function (entry) {
                        if (cardNames.indexOf(entry.cardName) === -1) {
                            cardNames.push(entry.cardName);
                        }
                    });

                    cardNames.sort(function (a, b) {
                        return a.localeCompare(b);
                    });

                    var source = document.createElement('div');
                    source.className = 'card-source';

                    var sourceLabel = document.createElement('strong');
                    sourceLabel.textContent = 'Found on these active cards:';

                    source.appendChild(sourceLabel);

                    var cardList = document.createElement('div');
                    cardList.textContent = cardNames.join(', ');

                    source.appendChild(cardList);
                    option.appendChild(source);

                    content.appendChild(option);
                });

            }).catch(function (error) {

                console.error(error);
                showMessage(
                    'Unable to load the checklists. ' +
                    (error.message || '')
                );
            });
        }

        function confirmClear(name, checklists) {

            var confirmed = window.confirm(
                'Clear all checkmarks in "' +
                name +
                '" across this board?'
            );

            if (!confirmed) {
                return;
            }

            clearChecklists(checklists);
        }

        function clearChecklists(selectedChecklists) {

            showMessage('Clearing checkmarks...');

            Promise.all([
                t.board('id'),
                getApi()
            ]).then(function (results) {

                var boardId = results[0].id;
                var api = results[1];

                return api.getToken().then(function (token) {

                    if (!token) {
                        throw new Error('Authorization is required.');
                    }

                    return getJson(
                        apiUrl(
                            '/boards/' + boardId +
                            '/cards?checklists=all',
                            token
                        )
                    ).then(function (cards) {

                        var requests = [];

                        cards.forEach(function (card) {

                            if (!card.checklists) {
                                return;
                            }

                            card.checklists.forEach(function (checklist) {

                                var selected = selectedChecklists.some(
                                    function (selectedChecklist) {
                                        return selectedChecklist.name ===
                                            checklist.name;
                                    }
                                );

                                if (!selected || !checklist.checkItems) {
                                    return;
                                }

                                checklist.checkItems.forEach(function (item) {

                                    if (item.state !== 'complete') {
                                        return;
                                    }

                                    requests.push(
                                        fetch(
                                            apiUrl(
                                                '/cards/' + card.id +
                                                '/checklist/' + checklist.id +
                                                '/checkItem/' + item.id +
                                                '?state=incomplete',
                                                token
                                            ),
                                            {
                                                method: 'PUT',
                                                headers: {
                                                    'Accept': 'application/json'
                                                }
                                            }
                                        ).then(function (response) {

                                            if (!response.ok) {
                                                throw new Error(
                                                    'Unable to uncheck "' +
                                                    item.name + '".'
                                                );
                                            }

                                            return response.json();
                                        })
                                    );
                                });
                            });
                        });

                        return Promise.all(requests);
                    });
                });

            }).then(function () {

                showMessage(
                    'Done. The selected checkmarks have been cleared.'
                );

                console.log('ABOUT TO CLOSE POPUP');
                t.closePopup();
                console.log('CLOSE COMMAND SENT');

            }).catch(function (error) {

                console.error(error);

                showMessage(
                    'Something went wrong while clearing the checkmarks. ' +
                    (error.message || '')
                );
            });
        }

        t.render(function () {

            getApi().then(function (api) {

                return api.isAuthorized();

            }).then(function (authorized) {

                if (authorized) {

                    loadChecklists();

                } else {

                    content.innerHTML = '';

                    var authorizeButton =
                        document.createElement('button');

                    authorizeButton.id = 'authorizeButton';
                    authorizeButton.textContent =
                        'Authorize Clear Checkmarks';

                    authorizeButton.onclick = function () {

                        getApi().then(function (api) {

                            return api.authorize({
                                scope: 'read,write'
                            });

                        }).then(function () {

                            loadChecklists();

                        }).catch(function (error) {

                            console.error(error);
                            showMessage(
                                'Authorization failed. Please try again.'
                            );
                        });
                    };

                    content.appendChild(authorizeButton);
                }

            }).catch(function (error) {

                console.error(error);
                showMessage('Unable to connect to Trello.');

            });
        });
    </script>
</body>
</html>
