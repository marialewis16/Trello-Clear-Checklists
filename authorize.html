<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Clear Checkmarks</title>
</head>
<body>
    <div id="content">Loading...</div>

    <script src="https://p.trellocdn.com/power-up.min.js"></script>

    <script>
        var t = window.TrelloPowerUp.iframe({
            appKey: '2ae1eadafa40bdc591b8e0ecbc9e5e6f',
            appName: 'Clear Checkmarks'
        });

        var content = document.getElementById('content');

        function showMessage(message) {
            content.innerHTML = '<p>' + message + '</p>';
        }

      function getApi() {
    return Promise.resolve(t.getRestApi());
}

        function loadChecklists() {
            showMessage('Finding checklists...');

            Promise.all([
                t.board('id'),
                getApi()
            ]).then(function (results) {

                var boardId = results[0].id;
                var api = results[1];

                return api.getToken().then(function (token) {

                    if (!token) {
                        throw new Error('Authorization is required.');
                    }

                    return fetch(
                        'https://api.trello.com/1/boards/' +
                        boardId +
                        '/checklists?key=2ae1eadafa40bdc591b8e0ecbc9e5e6f&token=' +
                        encodeURIComponent(token)
                    );
                });
            }).then(function (response) {

                if (!response.ok) {
                    throw new Error('Trello returned an error.');
                }

                return response.json();

            }).then(function (checklists) {

                if (!checklists || checklists.length === 0) {
                    showMessage('No checklists were found on this board.');
                    return;
                }

                content.innerHTML = '';

                var heading = document.createElement('p');
                heading.innerText = 'Choose a checklist to clear:';
                content.appendChild(heading);

                var allButton = document.createElement('button');
                allButton.innerText = 'All Checklists';
                allButton.style.display = 'block';
                allButton.style.marginBottom = '8px';

                allButton.onclick = function () {
                    confirmClear('All Checklists', checklists);
                };

                content.appendChild(allButton);

                var names = [];

                checklists.forEach(function (checklist) {
                    if (names.indexOf(checklist.name) === -1) {
                        names.push(checklist.name);
                    }
                });

                names.sort();

                names.forEach(function (name) {

                    var button = document.createElement('button');

                    button.innerText = name;
                    button.style.display = 'block';
                    button.style.marginBottom = '8px';

                    button.onclick = function () {

                        var matching = checklists.filter(function (checklist) {
                            return checklist.name === name;
                        });

                        confirmClear(name, matching);
                    };

                    content.appendChild(button);
                });

            }).catch(function (error) {

                console.error(error);
                showMessage('Unable to load the checklists.');

            });
        }

        function confirmClear(name, checklists) {

            var confirmed = window.confirm(
                'Clear all checkmarks in "' +
                name +
                '" across this board?'
            );

            if (!confirmed) {
                return;
            }

            clearChecklists(checklists);
        }

        function clearChecklists(selectedChecklists) {

            showMessage('Clearing checkmarks...');

            Promise.all([
                t.board('id'),
                getApi()
            ]).then(function (results) {

                var boardId = results[0].id;
                var api = results[1];

                return api.getToken().then(function (token) {

                    if (!token) {
                        throw new Error('Authorization is required.');
                    }

                    return fetch(
                        'https://api.trello.com/1/boards/' +
                        boardId +
                        '/cards?checklists=all&key=2ae1eadafa40bdc591b8e0ecbc9e5e6f&token=' +
                        encodeURIComponent(token)
                    ).then(function (response) {

                        if (!response.ok) {
                            throw new Error(
                                'Unable to load board cards.'
                            );
                        }

                        return response.json();

                    }).then(function (cards) {

                        var requests = [];

                        cards.forEach(function (card) {

                            if (!card.checklists) {
                                return;
                            }

                            card.checklists.forEach(function (checklist) {

                                var selected = selectedChecklists.some(
                                    function (selectedChecklist) {
                                        return selectedChecklist.name === checklist.name;
                                    }
                                );

                                if (!selected) {
                                    return;
                                }

                                if (!checklist.checkItems) {
                                    return;
                                }

                                checklist.checkItems.forEach(function (item) {

                                    if (item.state !== 'complete') {
                                        return;
                                    }

                                    requests.push(
                                        fetch(
                                            'https://api.trello.com/1/cards/' +
                                            card.id +
                                            '/checklist/' +
                                            checklist.id +
                                            '/checkItem/' +
                                            item.id +
                                            '?state=incomplete&key=2ae1eadafa40bdc591b8e0ecbc9e5e6f&token=' +
                                            encodeURIComponent(token),
                                            {
                                                method: 'PUT',
                                                headers: {
                                                    'Accept': 'application/json'
                                                }
                                            }
                                        ).then(function (response) {

                                            if (!response.ok) {
                                                throw new Error(
                                                    'Unable to uncheck "' +
                                                    item.name +
                                                    '".'
                                                );
                                            }

                                            return response.json();
                                        })
                                    );
                                });
                            });
                        });

                       return requests.reduce(function (promise, request) {
    return promise.then(function () {
        return request;
    });
}, Promise.resolve());
                    });
                });

           }).then(function () {
    showMessage(
        'Done. The selected checkmarks have been cleared.'
    );

   setTimeout(function () {
    window.parent.postMessage({ action: 'close' }, '*');
}, 1000);
}).catch(function (error) {

                console.error(error);

                showMessage(
                    'Something went wrong while clearing the checkmarks.'
                );
            });
        }

        t.render(function () {

            getApi().then(function (api) {

                return api.isAuthorized();

            }).then(function (authorized) {

                if (authorized) {

                    loadChecklists();

                } else {

                    content.innerHTML =
                        '<button id="authorizeButton">' +
                        'Authorize Clear Checkmarks' +
                        '</button>';

                    document.getElementById('authorizeButton').onclick =
                        function () {

                            getApi().then(function (api) {

                                return api.authorize({
                                    scope: 'read,write'
                                });

                            }).then(function () {

                                loadChecklists();

                            });
                        };
                }

            }).catch(function (error) {

                console.error(error);
                showMessage('Unable to connect to Trello.');

            });
        });
    </script>
</body>
</html>
