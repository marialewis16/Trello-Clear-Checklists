<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Clear Checkmarks</title>
</head>
<body>
    <button id="authorizeButton">Authorize Clear Checkmarks</button>

    <script src="https://p.trellocdn.com/power-up.min.js"></script>

    <script>
        var t = window.TrelloPowerUp.iframe({
            appKey: '2ae1eadafa40bdc591b8e0ecbc9e5e6f',
            appName: 'Clear Checkmarks'
        });

      t.render(function () {
    t.getRestApi().isAuthorized().then(function (authorized) {
        if (authorized) {
            document.getElementById('authorizeButton').innerText = 'Authorized ✓';
            document.getElementById('authorizeButton').disabled = true;
        }
    });
            document.getElementById('authorizeButton').onclick = function () {
             alert('Authorize button click detected');
                t.getRestApi().authorize({
                    scope: 'read,write'
                });
            };
        });
    </script>
</body>
</html>
