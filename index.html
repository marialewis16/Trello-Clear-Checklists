<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Trello Clear Checklists</title>
</head>
<body>
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <script>
        var ICON = 'https://marialewis16.github.io/Trello-Clear-Checklists/icon.svg';

        window.TrelloPowerUp.initialize({
            'board-buttons': function (t, opts) {
                return [{
                    text: 'Clear Checkmarks',
                    condition: 'edit',
                    callback: function (t) {
                        return t.popup({
                            title: 'Clear Checkmarks',
                            items: [
                                {
                                    text: 'Test Button',
                                    callback: function (t) {
                                        return t.alert({
                                            message: 'The Clear Checklists button is working.'
                                        });
                                    }
                                }
                            ]
                        });
                    }
                }];
            }
        });
    </script>
</body>
</html>
