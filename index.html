<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Trello Clear Checklists</title>
</head>
<body>
    <script src="https://p.trellocdn.com/power-up.min.js"></script>

    <script>
        window.TrelloPowerUp.initialize({
            'board-buttons': function (t, opts) {

                var buttons = [
                    {
                        text: 'Clear Checkmarks',
                        condition: 'edit',
                        callback: function (t) {
                            return t.popup({
                                title: 'Clear Checkmarks',
                                url: './authorize.html?v=5'
                            });
                        }
                    }
                ];

                var context = t.getContext();

                if (context.board === 'zXot8DtF') {

                    buttons.push({
                        text: 'Make Grocery List',
                        condition: 'edit',
                        callback: function (t) {
                            return t.popup({
                                title: 'Make Grocery List',
                                url: './grocery.html?v=1'
                            });
                        }
                    });

                }

                return buttons;
            }
        }, {
            appKey: '2ae1eadafa40bdc591b8e0ecbc9e5e6f',
            appName: 'Clear Checkmarks'
        });
    </script>
</body>
</html>
