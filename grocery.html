<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Make Grocery List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 12px;
            color: #172b4d;
        }

        h3 {
            margin-top: 0;
        }

        button {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            background: #0c66e4;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0055cc;
        }

        button:disabled {
            opacity: 0.6;
            cursor: default;
        }
    </style>
</head>
<body>
    <div id="content">Loading...</div>

    <script src="https://p.trellocdn.com/power-up.min.js"></script>

    <script>
        var t = window.TrelloPowerUp.iframe({
            appKey: '2ae1eadafa40bdc591b8e0ecbc9e5e6f',
            appName: 'Clear Checkmarks'
        });

        var content = document.getElementById('content');
        var groceryListBuilding = false;

        var API_KEY = '2ae1eadafa40bdc591b8e0ecbc9e5e6f';

        var NEXT_BOARD_NAME = "Next Week's Meals";
        var THIS_BOARD_NAME = "This Week's Meals";

        function showMessage(message) {
            content.textContent = message;
        }

        function getApi() {
            return Promise.resolve(t.getRestApi());
        }

        function apiUrl(path, token) {
            return 'https://api.trello.com/1' + path +
                (path.indexOf('?') === -1 ? '?' : '&') +
                'key=' + API_KEY +
                '&token=' + encodeURIComponent(token);
        }

        function getJson(url) {
            return fetch(url).then(function (response) {
                if (!response.ok) {
                    throw new Error(
                        'Trello request failed (' + response.status + ').'
                    );
                }

                return response.json();
            });
        }

              function showChoices() {
            content.innerHTML =
                '<button id="bothWeeksButton">Both Weeks</button>' +
                '<button id="nextWeekButton">Next Week\'s Meals</button>' +
                '<button id="thisWeekButton">This Week\'s Meals</button>';

            document.getElementById('bothWeeksButton').onclick =
                function () {
                    loadGroceryList('both');
                };

            document.getElementById('nextWeekButton').onclick =
                function () {
                    loadGroceryList('next');
                };

            document.getElementById('thisWeekButton').onclick =
                function () {
                    loadGroceryList('this');
                };
        }

        function loadGroceryList(selection) {
            if (groceryListBuilding) {
                return;
            }

            groceryListBuilding = true;

            showMessage('Building grocery list...');

            getApi().then(function (api) {
                return api.getToken();
            }).then(function (token) {

                if (!token) {
                    throw new Error('Authorization is required.');
                }

                return getJson(
                    apiUrl('/members/me/boards?fields=id,name,closed', token)
                ).then(function (boards) {

                    var nextBoard = boards.find(function (board) {
                        return board.name === NEXT_BOARD_NAME &&
                            !board.closed;
                    });

                    var thisBoard = boards.find(function (board) {
                        return board.name === THIS_BOARD_NAME &&
                            !board.closed;
                    });

                    if (!nextBoard) {
                        throw new Error(
                            'Could not find the board "' +
                            NEXT_BOARD_NAME + '".'
                        );
                    }

                    if (
                        (selection === 'this' || selection === 'both') &&
                        !thisBoard
                    ) {
                        throw new Error(
                            'Could not find the board "' +
                            THIS_BOARD_NAME + '".'
                        );
                    }

                    var sourceBoards = [];

                    if (selection === 'next' || selection === 'both') {
                        sourceBoards.push(nextBoard);
                    }

                    if (selection === 'this' || selection === 'both') {
                        sourceBoards.push(thisBoard);
                    }

                    return Promise.all([
                        Promise.resolve(token),
                        Promise.resolve(nextBoard),
                        Promise.resolve(sourceBoards)
                    ]);
                });
            }).then(function (info) {

                var token = info[0];
                var destinationBoard = info[1];
                var sourceBoards = info[2];

                var boardRequests = sourceBoards.map(function (board) {

                    return Promise.all([
                        getJson(
                            apiUrl(
                                '/boards/' + board.id + '/lists',
                                token
                            )
                        ),
                        getJson(
                            apiUrl(
                                '/boards/' + board.id +
                                '/cards?checklists=all',
                                token
                            )
                        )
                    ]).then(function (data) {
                        return {
                            board: board,
                            lists: data[0],
                            cards: data[1]
                        };
                    });
                });

                return Promise.all([
                    Promise.resolve(token),
                    getJson(
                        apiUrl(
                            '/boards/' + destinationBoard.id + '/lists',
                            token
                        )
                    ),
                    Promise.all(boardRequests)
                ]);
            }).then(function (data) {

                var token = data[0];
                var destinationLists = data[1];
                var sourceData = data[2];

                var groceriesList = destinationLists.find(function (list) {
                    return list.name === 'GROCERY LIST';
                });

                if (!groceriesList) {
                    throw new Error(
                        'The "GROCERY LIST" list was not found on "' +
                        NEXT_BOARD_NAME + '".'
                    );
                }

                var ingredients = [];

                sourceData.forEach(function (boardData) {

                    boardData.cards.forEach(function (card) {

                        var cardList = boardData.lists.find(function (list) {
                            return list.id === card.idList;
                        });

                        if (!cardList) {
                            return;
                        }

                        if (
                            cardList.name === 'REMOVE' ||
                            cardList.name === 'GROCERY LIST'
                        ) {
                            return;
                        }

                        if (!card.checklists) {
                            return;
                        }

                        card.checklists.forEach(function (checklist) {

                            if (checklist.name !== 'Ingredients') {
                                return;
                            }

                            if (!checklist.checkItems) {
                                return;
                            }

                            checklist.checkItems.forEach(function (item) {

                                if (item.state !== 'complete') {
                                    ingredients.push(item.name);
                                }
                            });
                        });
                    });
                });

                return {
                    token: token,
                    groceriesList: groceriesList,
                    ingredients: ingredients
                };
            }).then(function (data) {

                if (data.ingredients.length === 0) {
                    showMessage('No unchecked ingredients were found.');
                    groceryListBuilding = false;
                    return;
                }

                var counts = {};

                data.ingredients.forEach(function (ingredient) {
                    if (!counts[ingredient]) {
                        counts[ingredient] = 0;
                    }

                    counts[ingredient]++;
                });

                var combinedIngredients = Object.keys(counts).map(
                    function (ingredient) {
                        if (counts[ingredient] === 1) {
                            return ingredient;
                        }

                        return ingredient + ' ×' + counts[ingredient];
                    }
                );

                combinedIngredients.sort(function (a, b) {
                    return a.localeCompare(b);
                });

                return fetch(
                    apiUrl(
                        '/cards?idList=' +
                        encodeURIComponent(data.groceriesList.id) +
                        '&name=' + encodeURIComponent('Grocery List'),
                        data.token
                    ),
                    {
                        method: 'POST',
                        headers: {
                            'Accept': 'application/json'
                        }
                    }
                ).then(function (response) {

                    if (!response.ok) {
                        throw new Error(
                            'Unable to create the grocery card.'
                        );
                    }

                    return response.json();

                }).then(function (card) {

                    return fetch(
                        apiUrl(
                            '/cards/' + card.id +
                            '/checklists?name=Ingredients',
                            data.token
                        ),
                        {
                            method: 'POST',
                            headers: {
                                'Accept': 'application/json'
                            }
                        }
                    ).then(function (response) {

                        if (!response.ok) {
                            throw new Error(
                                'Unable to create the Ingredients checklist.'
                            );
                        }

                        return response.json();

                    }).then(function (checklist) {

                        var promise = Promise.resolve();

                        combinedIngredients.forEach(
                            function (ingredient) {

                                promise = promise.then(function () {

                                    return fetch(
                                        apiUrl(
                                            '/checklists/' + checklist.id +
                                            '/checkItems?name=' +
                                            encodeURIComponent(ingredient) +
                                            '&pos=bottom&checked=false',
                                            data.token
                                        ),
                                        {
                                            method: 'POST',
                                            headers: {
                                                'Accept': 'application/json'
                                            }
                                        }
                                    ).then(function (response) {

                                        if (!response.ok) {
                                            throw new Error(
                                                'Unable to add an ingredient.'
                                            );
                                        }

                                        return response.json();
                                    });
                                });
                            }
                        );

                        return promise;
                    });
                });
            }).then(function () {

                if (!groceryListBuilding) {
                    return;
                }

                showMessage(
                    'Done. Your grocery list has been created.'
                );

                setTimeout(function () {
                    t.closePopup();
                }, 2000);

            }).catch(function (error) {

                console.error(error);

                showMessage(
                    'Something went wrong while creating the grocery list. ' +
                    (error && error.message ? error.message : '')
                );

                groceryListBuilding = false;
            });
        }

        getApi().then(function (api) {
            return api.isAuthorized();

        }).then(function (authorized) {

            if (authorized) {
                showChoices();

            } else {

                content.innerHTML =
                    '<p>Authorize Clear Checkmarks to continue.</p>' +
                    '<button id="authorizeButton">' +
                    'Authorize Clear Checkmarks' +
                    '</button>';

                document.getElementById('authorizeButton').onclick =
                    function () {

                        getApi().then(function (api) {
                            return api.authorize({
                                scope: 'read,write'
                            });

                        }).then(function () {
                            showChoices();

                        }).catch(function (error) {
                            console.error(error);
                            showMessage(
                                'Authorization failed. Please try again.'
                            );
                        });
                    };
            }

        }).catch(function (error) {

            console.error(error);
            showMessage('Unable to connect to Trello.');
        });
    </script>
</body>
</html>
